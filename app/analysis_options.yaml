# The app package needs BOTH the workspace's strict analyzer settings and the
# Flutter-specific lints. Order matters: later includes win, so the root config
# comes last and its `errors:` severities are authoritative.
#
# The rule this exists for is `use_build_context_synchronously`. Nearly every
# handler in this package awaits a repository and then touches `context`, and
# without flutter_lints that is a silent crash source the analyzer will not
# mention.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include:
  - package:flutter_lints/flutter.yaml
  - ../analysis_options.yaml
