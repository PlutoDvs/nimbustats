include: package:lints/recommended.yaml

analyzer:
  exclude:
    # Written by `drift_dev schema generate` for the migration test and
    # regenerated whenever a schema version is added. It is drift's code, held
    # to drift's style, and editing it to satisfy this project's stricter rules
    # would be undone by the next regeneration.
    - packages/nimbus_data/test/generated/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Severity overrides only take effect for rules that are *enabled*. Both
    # avoid_print and empty_catches come from lints/recommended; unawaited_futures
    # does not, and is enabled explicitly in the linter section below.
    avoid_print: error
    empty_catches: error
    unawaited_futures: error

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - avoid_dynamic_calls
    - throw_in_finally
    - only_throw_errors
    # Ships in no ruleset, so it has to be requested by name. A dropped future
    # here loses a database write *and* the error that explains it -- exactly
    # the silent failure this project's rules exist to prevent.
    - unawaited_futures
