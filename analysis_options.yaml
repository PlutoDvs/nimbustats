include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    avoid_print: error
    empty_catches: error
    unawaited_futures: error

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - avoid_dynamic_calls
    - throw_in_finally
    - only_throw_errors
