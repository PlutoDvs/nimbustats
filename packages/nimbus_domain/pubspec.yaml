name: nimbus_domain
description: Pure-Dart domain layer — money, calendars, entitlements.
version: 0.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

# NOTE: this package is deliberately free of flutter, drift, sqlite3,
# flutter_riverpod, nimbus_data and nimbus_design. That is asserted by
# test/architecture_test.dart at the workspace root.
dependencies:
  shamsi_date: ^1.1.1
  meta: ^1.15.0
  # dedup_hash is UNIQUE at the database level, so a collision does not merely
  # risk a duplicate -- it makes the colliding message unstorable and loses the
  # raw text. SHA-256 is the difference between that being impossible and being
  # unlikely. Asserted by test/architecture_test.dart.
  crypto: ^3.0.7

dev_dependencies:
  test: ^1.25.0
