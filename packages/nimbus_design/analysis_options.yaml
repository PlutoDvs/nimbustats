# Same reasoning as app/analysis_options.yaml: this package builds widgets, so
# it needs the Flutter lints as well as the workspace's strict analyzer
# settings. Later includes win, so the root config stays authoritative.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include:
  - package:flutter_lints/flutter.yaml
  - ../../analysis_options.yaml
